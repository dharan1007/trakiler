name: Publish FORM Container

on:
  push:
    branches: [main]
    paths:
      - 'VERSION'
      - 'Dockerfile'
      - '.dockerignore'
      - 'index.html'
      - 'privacy.html'
      - 'terms.html'
      - 'styles.css'
      - 'v3.css'
      - 'v4.css'
      - 'readability.css'
      - 'data.js'
      - 'programs-v3.js'
      - 'club-config.js'
      - 'backend.js'
      - 'club.js'
      - 'app.js'
      - 'insights.js'
      - 'coach-v4.js'
      - 'assist.js'
      - 'project-notice.js'
      - '.github/workflows/package.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: form-container-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/form-training-system

jobs:
  publish:
    name: Build and publish public web container
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        run: echo "value=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.value }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
